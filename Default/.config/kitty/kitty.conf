# Font
font_family      monospace
font_size        12.0

# Background image: put an image path on the line below to enable it.
# background_image /mnt/windows/MSI/MSI Center/New folder/DESKTOP/Mila/2h0hrp.jpg
background_image_layout cscaled
background_tint  1

# Fallback transparency (used if no background_image is set, or blended with it)
